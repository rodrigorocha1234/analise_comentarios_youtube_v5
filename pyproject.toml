[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "radar-topicos-youtube"
version = "0.1.0"
description = "Plataforma de agrupamento não supervisionado e Trend Topics de comentários do YouTube"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "bertopic>=0.17.4",
    "spacy>=3.8.0",
    "scikit-learn>=1.4.0",
    "umap-learn>=0.5.5",
    "hdbscan>=0.8.33",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "pyarrow>=15.0.0",
    "boto3>=1.34.0",
    "mlflow>=2.10.0",
    "streamlit>=1.30.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "PyYAML>=6.0.1",
    "wordcloud>=1.9.0",
    "matplotlib>=3.8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

