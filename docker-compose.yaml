

volumes:
  pgdata:
  minio-data:

services:
  postgres:
    image: postgres:15
    container_name: mlflow-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: America/Sao_Paulo
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      mlflow-network:
        ipv4_address: 172.25.0.2

  minio:
    image: minio/minio:latest
    container_name: mlflow-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      TZ: America/Sao_Paulo
    volumes:
      - ./minio-data:/data
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${MINIO_PORT}/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      mlflow-network:
        ipv4_address: 172.25.0.3

  create-bucket:
    image: minio/mc:latest
    container_name: mlflow-create-bucket
    environment:
      TZ: America/Sao_Paulo
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set myminio "http://${MINIO_HOST}:${MINIO_PORT}" \
          "${MINIO_ROOT_USER}" "${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "myminio/${MINIO_BUCKET:-mlflow}"
    restart: "no"
    networks:
      mlflow-network:
        ipv4_address: 172.25.0.4

  mlflow:
    image: ghcr.io/mlflow/mlflow:${MLFLOW_VERSION}
    container_name: mlflow-server
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      create-bucket:
        condition: service_completed_successfully
    environment:
      MLFLOW_BACKEND_STORE_URI: ${MLFLOW_BACKEND_STORE_URI}
      MLFLOW_S3_ENDPOINT_URL: ${MLFLOW_S3_ENDPOINT_URL}
      MLFLOW_ARTIFACTS_DESTINATION: ${MLFLOW_ARTIFACTS_DESTINATION}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
      MLFLOW_S3_IGNORE_TLS: "true"
      MLFLOW_HOST: ${MLFLOW_HOST}
      MLFLOW_PORT: ${MLFLOW_PORT}
      MLFLOW_SERVER_ALLOWED_HOSTS: "*"
      TZ: America/Sao_Paulo
    command:
      - /bin/bash
      - -c
      - |
        pip install --no-cache-dir psycopg2-binary boto3
        mlflow server \
          --backend-store-uri "${MLFLOW_BACKEND_STORE_URI}" \
          --artifacts-destination "${MLFLOW_ARTIFACTS_DESTINATION}" \
          --serve-artifacts \
          --host "${MLFLOW_HOST}" \
          --port "${MLFLOW_PORT}" \
          --allowed-hosts "*" \
          --cors-allowed-origins "http://localhost:5000,http://127.0.0.1:5000,http://0.0.0.0:5000"
    ports:
      - "${MLFLOW_PORT}:${MLFLOW_PORT}"
      - "5004:5004"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:${MLFLOW_PORT}/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
    networks:
      mlflow-network:
        ipv4_address: 172.25.0.5

  mlflow-serving:
    image: ghcr.io/mlflow/mlflow:${MLFLOW_VERSION}
    container_name: mlflow-api-producao
    depends_on:
      mlflow:
        condition: service_healthy
    environment:
      TZ: America/Sao_Paulo
      MLFLOW_TRACKING_URI: http://mlflow-server:5000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      MLFLOW_S3_ENDPOINT_URL: http://${MINIO_HOST}:${MINIO_PORT}
      AWS_DEFAULT_REGION: us-east-1
      MLFLOW_SERVER_ALLOWED_HOSTS: "*"
    restart: always
    command:
      - /bin/bash
      - -c
      - |
        pip install --no-cache-dir psycopg2-binary boto3 scikit-learn pandas xgboost lightgbm catboost
        python -c "
        import time
        from mlflow.tracking import MlflowClient
        client = MlflowClient('http://mlflow-server:5000')
        print('Aguardando o modelo preco-imoveis@champion ser registrado no MLflow...')
        while True:
            try:
                mv = client.get_model_version_by_alias('preco-imoveis', 'champion')
                if mv:
                    print(f'Modelo preco-imoveis@champion encontrado (versão {mv.version})! Iniciando serving...')
                    break
            except Exception:
                pass
            time.sleep(5)
        "
        exec mlflow models serve \
          -m "models:/preco-imoveis@champion" \
          -p 5002 \
          --host 0.0.0.0 \
          --no-conda
    ports:
      - "5002:5002"
    networks:
      mlflow-network:
        ipv4_address: 172.25.0.6

  streamlit:
    build: .
    container_name: radar-topicos-streamlit
    restart: unless-stopped
    depends_on:
      minio:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minio}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minio123}
      MINIO_BUCKET: youtube-comentarios
      MLFLOW_TRACKING_URI: http://mlflow-server:5000
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minio}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minio123}
    ports:
      - "8501:8501"
    networks:
      mlflow-network:
        ipv4_address: 172.25.0.7

  aplicacao:
    build: .
    container_name: radar-topicos-pipeline
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    environment:
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minio}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minio123}
      MINIO_BUCKET: youtube-comentarios
      MLFLOW_TRACKING_URI: http://mlflow-server:5000
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minio}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minio123}
    command: ["python", "main.py"]
    networks:
      mlflow-network:
        ipv4_address: 172.25.0.8

networks:
  mlflow-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16