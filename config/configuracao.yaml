projeto:
  nome: agrupamento_youtube
  idioma: pt_BR

coleta:
  canais_alvo:
    - "UCoLf24olVUtKOsSXlqv_-ag" # Exemplo de canal tech/dev
  videos_alvo: []
  intervalo_horas: 24
  coletar_respostas: true
  coletar_todos_comentarios: true
  atualizar_comentarios: true
  maximo_videos_canal: 20

spacy:
  modelo: pt_core_news_md
  lote: 256

texto:
  lematizar: true
  remover_urls: true
  stopwords_adicionais:
    - "valeu"
    - "video"
    - "vídeo"
    - "canal"
    - "show"
    - "obrigado"
    - "ola"
    - "olá"

bertopic:
  top_n_words: 10

umap:
  n_neighbors: 15
  n_components: 5
  min_dist: 0.0
  metric: cosine
  random_state: 42

hdbscan:
  min_cluster_size: 15
  min_samples: 5
  metric: euclidean
  cluster_selection_method: eom
  prediction_data: true

count_vectorizer:
  ngram_min: 1
  ngram_max: 1
  min_df: 1
  max_df: 0.90
  max_features: 10000

algoritmos:
  kmeans:
    n_clusters: 10
    random_state: 42
  minibatch_kmeans:
    n_clusters: 10
    batch_size: 256
    random_state: 42
  dbscan:
    eps: 0.5
    min_samples: 5
    metric: cosine
  optics:
    min_samples: 5
    metric: cosine
  agglomerative:
    n_clusters: 10
    metric: cosine
    linkage: average
  gaussian_mixture:
    n_components: 10
    random_state: 42
  spectral:
    n_clusters: 10
    random_state: 42
  affinity_propagation:
    damping: 0.8
    random_state: 42
  mean_shift:
    bandwidth: 0.8
  birch:
    n_clusters: 10
    threshold: 0.5

execucao:
  modo: experimental # 'experimental' ou 'producao'
  modelos_producao:
    - bertopic
    - kmeans
    - hdbscan

tendencias:
  janelas_dias:
    - 1
    - 3
    - 7
    - 14
    - 30

armazenamento:
  bucket: youtube-comentarios
  formato: parquet

mlflow:
  experimento: agrupamento_youtube
  registrar_modelos: true
  versionar_schema: true
  versao_schema_entrada: "1.0.0"
  versao_schema_saida: "1.0.0"
