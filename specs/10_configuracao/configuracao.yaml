projeto:
  nome: agrupamento_youtube
  idioma: pt_BR
coleta:
  intervalo_horas: 24
  coletar_respostas: true
  coletar_todos_comentarios: true
  atualizar_comentarios: true
spacy:
  modelo: pt_core_news_lg
  lote: 256
texto:
  lematizar: true
  remover_urls: true
  stopwords_adicionais: []
bertopic:
  top_n_words: 10
umap:
  n_neighbors: 15
  n_components: 5
  min_dist: 0.0
  metric: cosine
  random_state: 42
hdbscan:
  min_cluster_size: 15
  min_samples: 5
  metric: euclidean
  cluster_selection_method: eom
  prediction_data: true
tendencias:
  janelas_dias: [1, 3, 7, 14, 30]
armazenamento:
  bucket: youtube-comentarios
  formato: parquet
mlflow:
  experimento: agrupamento_youtube
  registrar_modelos: true
  versionar_schema: true
